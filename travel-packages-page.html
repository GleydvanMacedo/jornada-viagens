<!doctype html>
<html lang="pt-br">

    <link rel="stylesheet" href="./css/style.css" />

    <title>Pacotes de Viagem</title>
  </head>
  <body>
    <header class="main-header">
      <a
        class="logo"
        href="index.html"
        title="Voltar para a página inicial do site Jornada Viagens"
      >
        <img
          class="img-mobile"
          src="./img/bussola-jornada-branca.png"
          alt="Bussola do logo Jornada Viagens na cor branca"
        />

        <img
          class="img-desktop"
          src="./img/bussola-texto-jornada-branca.png"
          alt="Logo Jornada Viagens na cor branca"
        />
      </a>

      <div class="navigation-menu">
        <label for="menu-toggle" class="menu-icon">
          <img src="./img/menu.png" alt="Menu de navegação" />
        </label>

        <input type="checkbox" id="menu-toggle" hidden />

        <nav role="navigation">
          <ul class="list-links">
            <li>
              <a href="blog.html" target="_blank" title="Acessar Blog">Blog</a>

            <li>
              <a

                class="travel-packages-link"
                target="_blank"
                title="Acessar Pacotes de Viagem"

            </li>
          </ul>
        </nav>

    <section class="hero travel-packages-hero">
      <div class="hero-img">
        <div class="travel-packages-hero-content">
          <h1>Conheça o Japão!</h1>
          <hr />
          <p>
            A Jornada possui o pacote perfeito para seu estilo e orçamento!
            Conheça as belas paisagens e a cultura milenar deste belo país!
          </p>
        </div>
      </div>
    </section>

    <section class="destinations"></section>

    <section class="payments"></section>

    <section class="testmonials"></section>

    <section class="bottom-hero"></section>

    <footer class="main-footer"></footer>
